<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Dragon Flames</title>
        <meta name="description" content="Dragon Flames — High-performance retro gaming emulator powered by EmulatorJS with multi-system support and custom ROM loader.">
        <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
        <meta name="viewport" content="width = device-width, initial-scale = 1">
        <script>
            // Polyfills and safeguards for sandboxed environments
            (function() {
                try {
                    var testKey = "__ejs_test__";
                    window.localStorage.setItem(testKey, testKey);
                    window.localStorage.removeItem(testKey);
                } catch (e) {
                    var memoryStorage = {};
                    try {
                        Object.defineProperty(window, 'localStorage', {
                            value: {
                                getItem: function(k) { return memoryStorage.hasOwnProperty(k) ? memoryStorage[k] : null; },
                                setItem: function(k, v) { memoryStorage[k] = String(v); },
                                removeItem: function(k) { delete memoryStorage[k]; },
                                clear: function() { memoryStorage = {}; },
                                key: function(i) { return Object.keys(memoryStorage)[i] || null; },
                                get length() { return Object.keys(memoryStorage).length; }
                            },
                            writable: true,
                            configurable: true
                        });
                    } catch (e2) {}
                }

                try {
                    if (!window.indexedDB) {}
                } catch (e) {
                    try {
                        Object.defineProperty(window, 'indexedDB', {
                            value: null,
                            writable: true,
                            configurable: true
                        });
                    } catch (e2) {}
                }

                function createSentinel(type) {
                    return {
                        released: false,
                        type: type || 'screen',
                        release: function() { this.released = true; return Promise.resolve(); },
                        addEventListener: function() {},
                        removeEventListener: function() {},
                        dispatchEvent: function() { return false; },
                        onrelease: null
                    };
                }
                try {
                    if (typeof navigator !== 'undefined' && 'wakeLock' in navigator && navigator.wakeLock) {
                        var originalRequest = navigator.wakeLock.request;
                        navigator.wakeLock.request = function(type) {
                            try {
                                return originalRequest.apply(this, arguments).catch(function() {
                                    return createSentinel(type);
                                });
                            } catch (e) {
                                return Promise.resolve(createSentinel(type));
                            }
                        };
                    }
                } catch (e) {}
                window.addEventListener('unhandledrejection', function(event) {
                    if (event.reason && (event.reason.name === 'NotAllowedError' || (event.reason.message && event.reason.message.includes('WakeLock')))) {
                        event.preventDefault();
                    }
                });
            })();
        </script>
        <style>
             body, html {
                height: 100%;
                background-color: black;
                color: white;
            }

            body {
                margin: 0;
                overflow: hidden;
            }

            body, #box, #top {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }

            #box {
                color: #aaa;
                height: 20em;
                width: 30em;
                max-width: 80%;
                max-height: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                text-align: center;
                padding: 10px;
            }

            #box:hover, #box[drag] {
                border-color: #1AAFFF;
                color: #ddd
            }

            #advanced {
                color: #aaa;
                text-align: left;
                width: 30em;
                max-width: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                padding: 10px;
            }

            #advancedOptionsBox {
                margin-top: 10px;
                font-size: 14px;
                margin-left: 20px;
            }

            .advancedOptionsBoxRow {
                margin-top: 10px;
            }

            #input {
                cursor: pointer;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
            }

            #display {
                width: 100%;
                height: 100%
            }

            select, button {
                padding: 0.6em 0.4em;
                margin: 0.5em;
                width: 15em;
                max-width: 100%;
                font-family: monospace;
                font-weight: bold;
                font-size: 16px;
                background-color: #444;
                color: #aaa;
                border-radius: 0.4em;
                border: 1px solid #555;
                cursor: pointer;
                transition-duration: 0.2s
            }

            select:hover, button:hover {
                background-color: #666;
                color: #ddd
            }

            .logo {
                width: 130px;
                height: 130px;
                filter: drop-shadow(0 0 8px white);
            }

            #top {
                margin: 5px;
            }
        </style>
    </head>

    <body>
        <div id="top">
            <h1>Dragon Flames</h1>
            <img src="docs/Logo-light.png" alt="Logo" class="logo">
            <br>
        </div>
        <div id="box">
            <input type="file" id ="input" title="Upload" />
            Drag ROM file or click here
        </div>
        <div id="advanced">
            <div id="advancedToggleBox">
                <input type="checkbox" id="advancedToggle" />
                <label for="advancedToggle"> Show Advanced Options</label>
            </div>
            <div id="advancedOptionsBox">
                <div class="advancedOptionsBoxRow">
                    <input type="file" id ="inputAdvanced" title="BIOS" />
                    <label for="inputAdvanced"> Upload BIOS file (if required)</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <input type="checkbox" id="debugToggle" />
                    <label for="debugToggle"> Enable Debug Mode</label>
                </div>
                <div id="advancedOptionsBoxThreads" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="threadsToggle" />
                    <label for="threadsToggle"> Enable Threads</label>
                </div>
                <div id="advancedOptionsCache" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="cacheToggle" checked="checked" />
                    <label for="cacheToggle"> Enable Cache</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <span>Browser mode: </span>
                    <input type="radio" id="browserModeAuto" name="browserMode" value="auto">
                    <label for="browserModeAuto"> Auto </label>
                    <input type="radio" id="browserModeDesktop" name="browserMode" value="desktop">
                    <label for="browserModeDesktop"> Desktop </label>
                    <input type="radio" id="browserModeMobile" name="browserMode" value="mobile">
                    <label for="browserModeMobile"> Mobile </label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <span>Data source: </span>
                    <select id="dataSourceSelect" style="width: auto; margin: 0; padding: 0.2em 0.5em; font-size: 13px;">
                        <option value="auto" selected>Auto (Local server if available, CDN for static / Google Pages)</option>
                        <option value="local">Local (data/ folder)</option>
                        <option value="cdn-stable">EmulatorJS CDN (Stable)</option>
                        <option value="cdn-latest">EmulatorJS CDN (Latest)</option>
                        <option value="cdn-nightly">EmulatorJS CDN (Nightly)</option>
                    </select>
                </div>
                <div class="advancedOptionsBoxRow">
                    <button type="button" id="clearCacheBtn" style="width: auto; padding: 0.3em 0.8em; font-size: 13px;">Clear Cached Cores & Data</button>
                    <span id="cacheClearStatus" style="font-size: 12px; margin-left: 10px; color: #1AAFFF;"></span>
                </div>
            </div>
        </div>

        <script>
            let enableDebug = false;
            let enableThreads = false;
            let browserMode;

            const biosFileInput = document.getElementById("inputAdvanced");
            
            const advancedToggle = document.getElementById("advancedToggle");
            const advanced = document.getElementById("advanced");
            const advancedOptionsBox = document.getElementById("advancedOptionsBox");
            advancedOptionsBox.style.display = "none";
            advancedToggle.addEventListener("change", (event) => {
                if (event.target.checked) {
                    advancedOptionsBox.style.display = "block";
                } else {
                    advancedOptionsBox.style.display = "none";
                }
            });

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const debugToggle = document.getElementById("debugToggle");
            debugToggle.addEventListener("change", (event) => {
                enableDebug = event.target.checked;
                console.log(`Debug is ${enableDebug ? "enabled" : "disabled"}`);
            });
            const cacheToggle = document.getElementById("cacheToggle");
            window.EJS_cacheConfig = {
                enabled: true,
                cacheMaxSizeMB: 4096, // 4096 MB = 4 GB
                cacheMaxAgeMins: 7200 // 7200 minutes = 5 days
            };
            cacheToggle.addEventListener("change", (event) => {
                const cacheEnabled = event.target.checked;
                console.log(`Cache is ${cacheEnabled ? "enabled" : "disabled"}`);
                window.EJS_cacheConfig.enabled = cacheEnabled;
            });
            const clearCacheBtn = document.getElementById("clearCacheBtn");
            const cacheClearStatus = document.getElementById("cacheClearStatus");
            if (clearCacheBtn) {
                clearCacheBtn.addEventListener("click", () => {
                    try {
                        if (typeof window !== "undefined" && window.indexedDB) {
                            window.indexedDB.deleteDatabase("EmulatorJS-Cache");
                            window.indexedDB.deleteDatabase("EmulatorJS-states");
                        }
                        if (cacheClearStatus) {
                            cacheClearStatus.textContent = "Cache cleared!";
                            setTimeout(() => { if (cacheClearStatus) cacheClearStatus.textContent = ""; }, 3000);
                        }
                    } catch (e) {
                        if (cacheClearStatus) cacheClearStatus.textContent = "Cleared";
                    }
                });
            }
            const threadsToggleAvailable = document.getElementById("advancedOptionsBoxThreads");
            const threadsToggle = document.getElementById("threadsToggle");
            threadsToggle.addEventListener("change", (event) => {
                enableThreads = event.target.checked;
                console.log(`Threads are ${enableThreads ? "enabled" : "disabled"}`);
            });
            if (parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true") {
                enableDebug = true;
                debugToggle.checked = true;
                console.log("Debug is enabled");
            } else {
                debugToggle.checked = false;
                console.log("Debug is disabled");
            }

            if (window.SharedArrayBuffer) {
                threadsToggleAvailable.style.display = "block";
                if (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true") {
                    enableThreads = true;
                    threadsToggle.checked = true;
                    console.log("Threads are enabled");
                } else {
                    threadsToggle.checked = false;
                    console.log("Threads are disabled");
                }
            } else {
                threadsToggleAvailable.style.display = "none";
                console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
            }

            const browserModeAuto = document.getElementById("browserModeAuto");
            browserModeAuto.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = undefined;
                    console.log("Browser mode set to auto");
                }
            });
            const browserModeDesktop = document.getElementById("browserModeDesktop");
            browserModeDesktop.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "desktop";
                    console.log("Browser mode set to desktop");
                }
            });
            const browserModeMobile = document.getElementById("browserModeMobile");
            browserModeMobile.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "mobile";
                    console.log("Browser mode set to mobile");
                }
            });
            if (urlParams.get("browserMode")) {
                browserMode = urlParams.get("browserMode");
                switch (browserMode) {
                    case 1:
                    case "1":
                    case "mobile":
                        browserModeMobile.checked = true;
                        break;
                    case 2:
                    case "2":
                    case "desktop":
                        browserModeDesktop.checked = true;
                        break;
                    default:
                        browserModeAuto.checked = true;
                        break;
                }
            } else {
                browserModeAuto.checked = true;
            }

            if (urlParams.get("rom")) {
                console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
                run(false, urlParams.get("rom"));
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : `roms/${file}`;
                const parts = upload ? input.files[0].name.split(".") : file.split(".");

                const biosUrl = biosFileInput.files.length > 0 ? biosFileInput.files[0] : "";

                const core = await (async (ext) => {
                    if (["fds", "nes", "unif", "unf"].includes(ext))
                        return "nes"

                    if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                        return "snes"

                    if (["z64", "n64"].includes(ext))
                        return "n64"

                    if (["pce"].includes(ext))
                        return "pce"

                    if (["ngp", "ngc"].includes(ext))
                        return "ngp"

                    if (["ws", "wsc"].includes(ext))
                        return "ws"

                    if (["col", "cv"].includes(ext))
                        return "coleco"

                    if (["d64"].includes(ext))
                        return "vice_x64sc"
                    
                    if (["md", "sg", "smd", "gen"].includes(ext))
                        return "segaMD"

                    if (["nds", "gba", "gb", "z64", "n64"].includes(ext))
                        return ext

                    if (["3ds", "cci", "cia", "cxi", "app"].includes(ext))
                        return "3ds"

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Nintendo 64": "n64",
                            "Nintendo Game Boy": "gb",
                            "Nintendo Game Boy Advance": "gba",
                            "Nintendo DS": "nds",
                            "Nintendo Entertainment System": "nes",
                            "Super Nintendo Entertainment System": "snes",
                            "PlayStation": "psx",
                            "Virtual Boy": "vb",
                            "Sega Mega Drive": "segaMD",
                            "Sega Master System": "segaMS",
                            "Sega CD": "segaCD",
                            "Atari Lynx": "lynx",
                            "Sega 32X": "sega32x",
                            "Atari Jaguar": "jaguar",
                            "Sega Game Gear": "segaGG",
                            "Sega Saturn": "segaSaturn",
                            "Atari 7800": "atari7800",
                            "Atari 2600": "atari2600",
                            "Arcade": "arcade",
                            "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                            "NEC PC-FX": "pcfx",
                            "SNK NeoGeo Pocket (Color)": "ngp",
                            "Bandai WonderSwan (Color)": "ws",
                            "ColecoVision": "coleco",
                            "Commodore 64": "vice_x64sc",
                            "Commodore 128": "vice_x128",
                            "Commodore VIC20": "vice_xvic",
                            "Commodore Plus/4": "vice_xplus4",
                            "Commodore PET": "vice_xpet",
                            "Amiga": "puae"
                        }
                        
                        if (enableThreads) {
                            coreValues["DOSBOX-PURE"] = "dosbox_pure";
                            coreValues["PlayStation Portable"] = "ppsspp";
                            coreValues["Nintendo 3DS"] = "3ds";
                        }

                        for (let core in coreValues) {
                            if (core.toLowerCase() === ext) {
                                resolve(core)
                            }
                        }
 
                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(parts.pop())

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                let dataPath = "data/";
                const dataSourceSelect = document.getElementById("dataSourceSelect");
                const dataSourceValue = dataSourceSelect ? dataSourceSelect.value : "auto";
                if (dataSourceValue === "local") {
                    dataPath = "data/";
                } else if (dataSourceValue === "cdn-stable") {
                    dataPath = "https://cdn.emulatorjs.org/stable/data/";
                } else if (dataSourceValue === "cdn-latest") {
                    dataPath = "https://cdn.emulatorjs.org/latest/data/";
                } else if (dataSourceValue === "cdn-nightly") {
                    dataPath = "https://cdn.emulatorjs.org/nightly/data/";
                } else {
                    const isGoogle = typeof window !== "undefined" && (window.location.hostname.includes("google") || window.location.origin === "null");
                    if (window.location.protocol.startsWith("http") && !isGoogle) {
                        dataPath = "data/";
                    } else {
                        dataPath = "https://cdn.emulatorjs.org/stable/data/";
                    }
                }

                const top = document.getElementById("top");
                top.remove();
                box.remove();
                div.appendChild(sub);
                advanced.remove();
                document.body.appendChild(div);

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = biosUrl;
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = dataPath;
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_threads = enableThreads;
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }
                window.EJS_askBeforeExit = false;
                window.EJS_onExit = () => {
                        alert("The emulator has exited. This callback can be used to do any cleanup or show a message to the user.");
                    };

                script.src = dataPath + "loader.js";
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
